function spinWheel(){
  if(duelSpinning) return;
  const candidates = TRAINERS.filter(t=> !(duelState.picks||[]).includes(t));
  if(candidates.length < 2) return; // ya está decidido
  duelSpinning = true;
  render();
  const idx = Math.floor(Math.random()*candidates.length);
  const segAngle = 360/candidates.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  duelWheelRotation += target;
  const wheelEl = document.getElementById('duel-wheel');
  wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
  // forzar reflow para que la transición se aplique
  void wheelEl.offsetWidth;
  wheelEl.style.transform = `rotate(${duelWheelRotation}deg)`;
  playSound('spin');

  setTimeout(async ()=>{
    duelSpinning = false;
    playSound('wheelLand');
    const picked = candidates[idx];
    duelState.picks = [...(duelState.picks||[]), picked];
    duelWheelRotation = 0; // la siguiente rueda tiene otro número de candidatos, debe arrancar limpia
    if(duelState.picks.length === 2){
      const bye = TRAINERS.find(t=> !duelState.picks.includes(t));
      duelState.bye = bye;
      duelState.match1 = { p1: duelState.picks[0], p2: duelState.picks[1] };
      duelState.match1Winner = null;
      duelState.match1LoserPrize = null;
      duelState.finalWinner = null;
      duelState.finalWinnerPrize = null;
      duelState.finalLoserPrize = null;
    }
    render();
    const ok = await saveDuelState();
    if(!ok) queueRetry('duel', saveDuelState);
  }, 4300);
}

// Resultados de la partida anterior (SoulSilver), para usar como precedente
// cuando dos entrenadores no se han enfrentado nunca en esta partida de X/Y.
// Se rellena a mano -- clave "trainerA-trainerB" en orden alfabetico, con
// las victorias de cada uno. Vacio por ahora.
const SOULSILVER_HISTORY = {
  'alex-iker': { alex: 0, iker: 1 },
  'alex-joel': { alex: 1, joel: 1 },
  'iker-joel': { iker: 1, joel: 0 },
};
function getSoulSilverRecord(a, b){
  const key = [a,b].sort().join('-');
  return SOULSILVER_HISTORY[key] || null;
}

// ---- Narracion de cada juego del BO3: varias variantes por categoria, sin
// repetir la misma hasta que se hayan usado todas (se reinicia cada semana). ----
function pickNarrationVariant(category, variants){
  duelState.usedNarrations = duelState.usedNarrations || {};
  let used = duelState.usedNarrations[category] || [];
  let available = variants.map((_,i)=>i).filter(i=>!used.includes(i));
  if(available.length === 0){ used = []; available = variants.map((_,i)=>i); }
  const idx = available[Math.floor(Math.random()*available.length)];
  duelState.usedNarrations[category] = [...used, idx];
  return variants[idx];
}

// Elige un Pokémon vivo al azar del equipo de un entrenador, para meterlo en
// las narraciones. Devuelve {nickname, species} o null si no tiene equipo.
function pickTeamMon(trainer){
  const alive = allMonsOf(trainer).filter(m=>m.inTeam && !m.fainted);
  if(alive.length === 0) return null;
  const mon = alive[Math.floor(Math.random()*alive.length)];
  const species = mon.speciesName.replace(/-/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
  return { nickname: mon.nickname, species };
}

function bo3Narration(games, p1, p2, isFinal){
  const winner = games[games.length - 1];
  const loser = winner === p1 ? p2 : p1;
  const wins = { [p1]: 0, [p2]: 0 };
  games.forEach(g => wins[g]++);
  const gameNum = games.length;
  const label = isFinal ? 'la Final' : 'el enfrentamiento';
  const W = NAMES[winner], L = NAMES[loser], P1 = NAMES[p1], P2 = NAMES[p2];
  const wMon = pickTeamMon(winner), lMon = pickTeamMon(loser);

  if(gameNum === 1){
    const { wins: priorWins, total } = headToHeadTally(p1, p2);
    if(total === 0){
      const ss = getSoulSilverRecord(p1, p2);
      if(ss){
        const variants = [
          () => `📼 Aquí no hay historial de esta partida, pero sí de la anterior: en SoulSilver el marcador entre ${P1} y ${P2} quedó ${P1} ${ss[p1]}-${ss[p2]} ${P2}. Con esos números de fondo llega este primer cruce en Kalos, y el primer asalto se lo lleva <strong>${W}</strong> — ¿se repetirá la historia, o esta vez todo empieza de cero de verdad?`,
          () => `📼 Nueva región, viejas cuentas pendientes. ${P1} y ${P2} ya se vieron las caras en SoulSilver (${P1} ${ss[p1]}-${ss[p2]} ${P2}), y aunque aquí el marcador arranca en blanco, ese precedente sigue pesando. El primer asalto en Kalos cae del lado de <strong>${W}</strong>.`,
          () => `📼 Antes de Kalos hubo Johto. Aquella vez terminó ${P1} ${ss[p1]}-${ss[p2]} ${P2}, y aunque el contador de esta partida se pone a cero, el recuerdo no. El primer round de este nuevo capítulo lo gana <strong>${W}</strong> — toca ver si esta rivalidad sigue el mismo guion o le da la vuelta del todo.`,
          () => `📼 Hay partidas que terminan pero las rivalidades no. En SoulSilver quedó ${P1} ${ss[p1]}-${ss[p2]} ${P2}, y aunque han pasado región, consola y unos cuantos años, ${P1} y ${P2} se vuelven a encontrar. El primer asalto de esta nueva era lo firma <strong>${W}</strong>.`,
          () => `📼 Los libros de Johto ya tienen un capítulo escrito sobre esto (${P1} ${ss[p1]}-${ss[p2]} ${P2}), pero Kalos empieza su propia historia desde cero. Eso sí, el primer golpe de esta nueva etapa lo da <strong>${W}</strong> — con o sin precedente, hay que ganárselo igual.`,
          () => `📼 Rivalidad de toda la vida, escenario nuevo. Lo de SoulSilver (${P1} ${ss[p1]}-${ss[p2]} ${P2}) se queda como referencia, pero en Kalos manda lo de hoy — y hoy manda <strong>${W}</strong>, que se adelanta en el primer asalto.`,
          ...(wMon ? [() => `📼 En SoulSilver el marcador quedó ${P1} ${ss[p1]}-${ss[p2]} ${P2}, pero eso fue otra región, otra época. Aquí y ahora, el primer golpe lo da <strong>${wMon.species}</strong>, del equipo de ${W} — Kalos empieza a escribir su propia versión de esta rivalidad.`] : []),
        ];
        return pickNarrationVariant('g1_soulsilver', variants)();
      }
      const variants = [
        () => `🎬 Es la primera vez en toda la partida que ${P1} y ${P2} se cruzan cara a cara — no hay precedentes, no hay estadísticas que valgan, solo lo que pase ahora mismo sobre el campo de batalla. Y el que se lleva este primer asalto es <strong>${W}</strong>, abriendo el marcador y sembrando la primera duda: ¿arranca aquí el inicio de una rivalidad que va a dar que hablar durante toda la partida?`,
        () => `🎬 Estreno absoluto. ${P1} y ${P2} nunca se habían enfrentado hasta hoy, así que todo lo que pase a partir de ahora se escribe por primera vez. El primer capítulo de esta historia lo firma <strong>${W}</strong>, que se adelanta en el marcador y deja a ${L} con la obligación de responder cuanto antes.`,
        () => `🎬 Sin cartas marcadas, sin favoritos, sin historia previa: ${P1} contra ${P2} tal cual, a las claras. Y el primer golpe sobre la mesa lo pone <strong>${W}</strong> — el resto de la partida dirá si esto era solo el principio.`,
        () => `🎬 Ni una sola vez se habían visto las caras ${P1} y ${P2} antes de hoy. Así que este primer asalto no es solo un punto en el marcador, es el pistoletazo de salida de una rivalidad entera — y quien se lleva ese honor es <strong>${W}</strong>.`,
        () => `🎬 Dos entrenadores, cero enfrentamientos previos, y una pregunta en el aire: ¿cómo empieza esto? La respuesta la escribe <strong>${W}</strong>, que se lleva el primer asalto y deja a ${L} con la obligación de reaccionar ya mismo, sin tiempo que perder.`,
        () => `🎬 A veces el primer cruce entre dos rivales no dice nada sobre lo que viene después — y a veces lo dice todo. Habrá que esperar para saberlo, pero de momento el que manda es <strong>${W}</strong>, ganador de un primer asalto que quedará como referencia el resto de la partida.`,
        ...(wMon ? [() => `🎬 Primer capítulo de una rivalidad que empieza hoy entre ${P1} y ${P2}. El protagonista del estreno tiene nombre propio: <strong>${wMon.nickname}</strong>, de <strong>${W}</strong>, que se lleva el primer asalto y deja a ${L} con la lección aprendida antes incluso de que esto empiece de verdad.`] : []),
        ...(wMon ? [() => `🎬 Nadie sabía qué esperar de este primer cruce entre ${P1} y ${P2} — y la respuesta la ha dado un ${wMon.species}. El equipo de <strong>${W}</strong> se lleva el primer asalto, y ${L} ya sabe con quién tiene que tener cuidado.`] : []),
      ];
      return pickNarrationVariant('g1_first', variants)();
    }
    const streak = headToHeadStreak(headToHeadMatches(p1, p2));
    const streakLine = (streak && streak.count >= 2 && streak.winner === winner)
      ? ` Y no es casualidad: ${W} llega a este cruce con ${streak.count} victorias seguidas contra ${L} en el bolsillo, así que empieza con la moral bien alta.`
      : (streak && streak.count >= 2 && streak.winner === loser)
        ? ` Lo curioso es que ${L} venía de ganarle ${streak.count} veces seguidas a ${W} — pero eso, de momento, se queda en el pasado.`
        : '';
    const variants = [
      () => `🥊 Se levanta el telón sobre un nuevo capítulo entre ${P1} y ${P2}, dos entrenadores que ya se conocen de sobra: antes de este cruce el historial general estaba ${P1} ${priorWins[p1]}-${priorWins[p2]} ${P2}, así que aquí nadie empieza de cero. El primer asalto se lo lleva <strong>${W}</strong>, que pone tierra de por medio desde el primer momento.${streakLine} La pregunta ahora es si ${L} tiene respuesta, o si esto se va a poner cuesta arriba muy pronto.`,

async function recordBo3Game(matchKey, gameWinner){
  const isFinal = matchKey === 'final';
  const p1 = isFinal ? duelState.match1Winner : duelState.match1.p1;
  const p2 = isFinal ? duelState.bye : duelState.match1.p2;
  const gamesKey = isFinal ? 'finalGames' : 'match1Games';

  duelState[gamesKey] = [...(duelState[gamesKey]||[]), gameWinner];
  const games = duelState[gamesKey];
  const wins = { [p1]: 0, [p2]: 0 };
  games.forEach(g => wins[g]++);
  const matchDecided = wins[p1] === 2 || wins[p2] === 2;
  const matchWinner = wins[p1] === 2 ? p1 : (wins[p2] === 2 ? p2 : null);

  // La narracion se calcula UNA sola vez aqui (elige variante al azar) y se
  // guarda como texto fijo -- si se recalculara en cada render() cambiaria
  // sola cada pocos segundos y no daria tiempo a leerla.
  duelState[isFinal ? 'finalNarration' : 'match1Narration'] = bo3Narration(games, p1, p2, isFinal);

  playSound(matchDecided ? (isFinal ? 'bigwin' : 'win') : 'reelStop');
  if(matchDecided) fireConfetti({ count: isFinal ? 220 : 70 });
  render();

  if(matchDecided){
    if(isFinal) duelState.finalWinner = matchWinner;
    else duelState.match1Winner = matchWinner;
  }
  const ok = await saveDuelState();
  if(!ok) queueRetry('duel', saveDuelState);

  if(matchDecided){
    if(isFinal){
      await addTickets(p1, 5, 'Jugar la Final');
      await addTickets(p2, 5, 'Jugar la Final');
    } else {
      await addTickets(p1, 5, 'Jugar el Combate 1');
      await addTickets(p2, 5, 'Jugar el Combate 1');
    }
    await resolveDuelBets(matchKey, matchWinner);
  }
  render();
}

function openChallenge(targetTrainer){
  if(challengeState){
    openModal(`<h3>⚔️ Desafío</h3><div class="empty-state">Ya hay un desafío en marcha (${NAMES[challengeState.challenger]} vs ${NAMES[challengeState.opponent]}). Termínalo antes de crear otro.</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cerrar</button></div>`);
    return;
  }
  const challengers = TRAINERS.filter(t=>t!==targetTrainer);
  openModal(`
    <h3>⚔️ Desafiar a ${NAMES[targetTrainer]}</h3>
    <div style="font-size:12px;color:var(--silver-dim);margin-bottom:12px;">Cuesta ${CHALLENGE_COST} tickets al que desafía. Se juega un BO3 — si gana, se lleva lo apostado. Si pierde, no pasa nada más (los tickets de entrada no se devuelven).</div>
    <div class="field">
      <label>¿Quién desafía?</label>
      <select id="challenge-who-select">
        ${challengers.map(t=>`<option value="${t}">${NAMES[t]} (${tickets[t]||0} 🎟️)</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>¿Qué se apuesta?</label>
      <select id="challenge-stake-select" onchange="renderChallengeMonPicker('${targetTrainer}')">
        ${CHALLENGE_STAKES.map(s=>`<option value="${s.id}">${s.label}</option>`).join('')}
      </select>

    <div id="challenge-mon-picker"></div>
    <div class="err-msg" id="challenge-err"></div>

      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="confirmChallenge('${targetTrainer}')">Desafiar</button>
    </div>
  `);
  renderChallengeMonPicker(targetTrainer);
}
function renderChallengeMonPicker(targetTrainer){
  const stakeId = document.getElementById('challenge-stake-select').value;
  const stake = CHALLENGE_STAKES.find(s=>s.id===stakeId);
  const el = document.getElementById('challenge-mon-picker');
  if(!stake.needsMonPick){ el.innerHTML = ''; return; }
  const pool = allMonsOf(targetTrainer);
  if(pool.length === 0){ el.innerHTML = `<div class="table-hint">${NAMES[targetTrainer]} no tiene ningún Pokémon.</div>`; return; }
  el.innerHTML = `
    <div class="field">
      <label>¿Cuál de sus Pokémon?</label>
      <select id="challenge-mon-select">
        ${pool.map(m=>`<option value="${m.pid}">${m.nickname} (${m.speciesName.replace(/-/g,' ')}) ${m.inTeam?'· equipo':'· caja'}</option>`).join('')}
      </select>
    </div>
  `;
}
async function confirmChallenge(targetTrainer){
  const challenger = document.getElementById('challenge-who-select').value;
  const stakeId = document.getElementById('challenge-stake-select').value;
  const stake = CHALLENGE_STAKES.find(s=>s.id===stakeId);
  const err = document.getElementById('challenge-err');
  if((tickets[challenger]||0) < CHALLENGE_COST){
    err.textContent = `${NAMES[challenger]} no tiene suficientes tickets.`;
    return;
  }
  let stakeMonPid = null, stakeMonLabel = null;
  if(stake.needsMonPick){
    const monSel = document.getElementById('challenge-mon-select');
    if(!monSel){ err.textContent = `${NAMES[targetTrainer]} no tiene ningún Pokémon para apostar.`; return; }
    stakeMonPid = monSel.value;
    const mon = allMonsOf(targetTrainer).find(m=>m.pid===stakeMonPid);
    stakeMonLabel = mon ? `${mon.nickname} (${mon.speciesName.replace(/-/g,' ')})` : null;
  }
  await addTickets(challenger, -CHALLENGE_COST, `Desafío contra ${NAMES[targetTrainer]}`);
  challengeState = {
    challenger, opponent: targetTrainer, stakeId, stakeMonPid, stakeMonLabel,
    games: [], narration: null,
  };
  pushHistory(`⚔️ ${NAMES[challenger]} ha desafiado a ${NAMES[targetTrainer]} — en juego: ${stake.label}${stakeMonLabel ? ` (${stakeMonLabel})` : ''}`);
  closeModal();
  render();
  const ok = await saveChallengeState();
  if(!ok) queueRetry('challenge', saveChallengeState);
}

function renderChallengeSection(){
  if(!challengeState) return '';
  const { challenger, opponent, games, stakeId, stakeMonLabel } = challengeState;
  const stake = CHALLENGE_STAKES.find(s=>s.id===stakeId);
  const wins = { [challenger]:0, [opponent]:0 };
  (games||[]).forEach(g=>wins[g]++);
  const decided = wins[challenger]===2 || wins[opponent]===2;
  const winner = wins[challenger]===2 ? challenger : (wins[opponent]===2 ? opponent : null);
  return `
    <div class="section-label" style="margin-top:24px;">⚔️ Desafío en marcha</div>
    <div class="bracket-match ${decided?'':'active'}">
      <div class="match-label">${stake.label}${stakeMonLabel ? ` — ${stakeMonLabel}` : ''} ${games.length>0 && !decided ? `· Juego ${Math.min(games.length+1,3)} de 3` : ''}</div>
      <div class="bracket-vs">
        <div class="bracket-player ${winner===challenger?'winner':''} ${decided?'locked':''}" ${decided?'':`onclick="recordChallengeGame('${challenger}')"`}>${NAMES[challenger]}</div>
        <div class="bracket-vs-sep">VS</div>
        <div class="bracket-player ${winner===opponent?'winner':''} ${decided?'locked':''}" ${decided?'':`onclick="recordChallengeGame('${opponent}')"`}>${NAMES[opponent]}</div>

    ${games.length>0 ? `<div class="bo3-narration">${challengeState.narration || 'Resultado registrado.'}<div class="bo3-reader-note">🎙️ Lo tiene que leer el que no está combatiendo</div></div>` : ''}
    ${decided ? `<div class="modal-actions" style="justify-content:center;"><button class="primary" onclick="closeChallenge()">Cerrar desafío</button></div>` : ''}

async function recordChallengeGame(gameWinner){
  if(!challengeState) return;
  const { challenger, opponent } = challengeState;
  challengeState.games = [...(challengeState.games||[]), gameWinner];
  const games = challengeState.games;
  const wins = { [challenger]:0, [opponent]:0 };
  games.forEach(g=>wins[g]++);
  const decided = wins[challenger]===2 || wins[opponent]===2;
  const winner = wins[challenger]===2 ? challenger : (wins[opponent]===2 ? opponent : null);

  challengeState.narration = bo3Narration(games, challenger, opponent, false);

  playSound(decided ? 'win' : 'reelStop');
  if(decided) fireConfetti({ count: 90 });
  render();

  if(decided){
    const loser = winner===challenger ? opponent : challenger;
    duelHistory.unshift({
      id: crypto.randomUUID(),
      name: `Desafío: ${NAMES[challenger]} vs ${NAMES[opponent]}`,
      date: new Date().toISOString(),
      match1: { p1: challenger, p2: opponent, winner },
      final: null,
      champion: winner,
      isChallenge: true,
    });
    await saveDuelHistory();
    await resolveChallengeReward(winner, loser);
  }
  const ok = await saveChallengeState();
  if(!ok) queueRetry('challenge', saveChallengeState);
}

async function resolveChallengeReward(winner, loser){
  const { stakeId, stakeMonLabel } = challengeState;
  const src = `Desafío ganado a ${NAMES[loser]}`;
  if(stakeId === 'all_tickets'){
    const stolen = tickets[loser]||0;
    await addTickets(loser, -stolen, `Perdió un desafío contra ${NAMES[winner]}`);
    await addTickets(winner, stolen, `Ganó un desafío contra ${NAMES[loser]} (+${stolen} tickets robados)`);
  } else if(stakeId === 'steal_heart'){
    hearts[loser] = Math.max((hearts[loser]??20) - 1, -1);
    hearts[winner] = Math.min((hearts[winner]??20) + 1, 20);
    pushHistory(`💔 ${NAMES[winner]} le robó 1 vida a ${NAMES[loser]} en un desafío (${NAMES[winner]}: ${hearts[winner]}/20, ${NAMES[loser]}: ${hearts[loser]}/20)`);
    render();
    const ok1 = await saveProfile(winner); if(!ok1) queueRetry('profile:'+winner, ()=>saveProfile(winner));
    const ok2 = await saveProfile(loser); if(!ok2) queueRetry('profile:'+loser, ()=>saveProfile(loser));
  } else if(stakeId === 'capsules'){
    await addPendingPrize(winner, '5 Cápsulas Habilidad', src);
  } else if(stakeId === 'mints'){
    await addPendingPrize(winner, '5 Mentas de Naturaleza', src);
  } else if(stakeId === 'full_restores'){
    await addPendingPrize(winner, '2 Restaurar Todo', src);
  } else if(stakeId === 'steal_money'){
    await addPendingPrize(winner, 'Robar 100.000 monedas (manual en PKHeX: +100k a ti, -100k a él)', src);
  } else if(stakeId === 'steal_pokemon'){
    await addPendingPrize(winner, `Te quedas con ${stakeMonLabel || 'el Pokémon apostado'} de ${NAMES[loser]}`, src);
  } else if(stakeId === 'rename'){
    await addPendingPrize(winner, `Puedes ponerle el apodo que quieras a ${stakeMonLabel || 'el Pokémon apostado'} de ${NAMES[loser]}`, src);
  }
}
async function closeChallenge(){
  challengeState = null;
  render();
  const ok = await saveChallengeState();
  if(!ok) queueRetry('challenge', saveChallengeState);
}

function spinFinalWheel(role){
  const spinningFlag = role==='winner' ? finalWheelSpinningWinner : finalWheelSpinningLoser;
  const prizeAlreadySet = role==='winner' ? duelState.finalWinnerPrize : duelState.finalLoserPrize;
  if(spinningFlag || prizeAlreadySet) return;
  const prizes = role==='winner' ? WINNER_PRIZES : LOSER_PRIZES;
  const wheelId = role==='winner' ? 'final-wheel-winner' : 'final-wheel-loser';

  if(role==='winner') finalWheelSpinningWinner = true; else finalWheelSpinningLoser = true;
  render();

  const idx = Math.floor(Math.random()*prizes.length);
  const segAngle = 360/prizes.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  if(role==='winner'){ finalWheelRotationWinner += target; } else { finalWheelRotationLoser += target; }

  const wheelEl = document.getElementById(wheelId);
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${role==='winner'?finalWheelRotationWinner:finalWheelRotationLoser}deg)`;
  }
  playSound('spin');

  setTimeout(async ()=>{
    const prize = prizes[idx];
    const trainer = role==='winner' ? duelState.finalWinner : [duelState.match1Winner, duelState.bye].find(p=> p!==duelState.finalWinner);
    if(role==='winner'){
      finalWheelSpinningWinner = false;
      duelState.finalWinnerPrize = prize;
    } else {
      finalWheelSpinningLoser = false;
      duelState.finalLoserPrize = prize;
    }
    playSound('wheelLand');
    render();
    const ok = await saveDuelState();
    if(!ok) queueRetry('duel', saveDuelState);
    await applyPrizeToTrainer(trainer, prize, role==='winner' ? 'Ruleta del ganador de la final' : 'Ruleta del perdedor de la final');
    render();
  }, 4300);
}

async function finishDuel(){
  const { scheduled, bye, match1, match1Winner, match1LoserPrize, finalWinner, finalWinnerPrize, finalLoserPrize } = duelState;
  const finalLoser = [match1Winner, bye].find(p=> p!==finalWinner);
  duelHistory.unshift({
    id: crypto.randomUUID(),
    name: scheduled.name,
    date: scheduled.datetime,
    match1: { p1: match1.p1, p2: match1.p2, winner: match1Winner },
    final: { p1: match1Winner, p2: bye, winner: finalWinner },
    champion: finalWinner,
    match1WinnerReward: '1 captura extra',
    match1LoserPrize,
    finalWinnerPrize,
    finalLoserPrize,
    finalLoser,
    ts: Date.now()
  });
  duelState = { scheduled:null, picks:[], bye:null, match1:null, match1Games:[], match1Winner:null, match1LoserPrize:null, finalGames:[], finalWinner:null, finalWinnerPrize:null, finalLoserPrize:null };
  duelWheelRotation = 0;
  finalWheelRotationWinner = 0;
  finalWheelRotationLoser = 0;
  finalWheelSpinningWinner = false;
  finalWheelSpinningLoser = false;
  match1LoserWheelRotation = 0;
  match1LoserWheelSpinning = false;
  render();
  const ok1 = await saveDuelHistory();
  if(!ok1) queueRetry('duelHistory', saveDuelHistory);
  const ok2 = await saveDuelState();
  if(!ok2) queueRetry('duel', saveDuelState);
}

async function loseLife(t){
  hearts[t] = Math.max(hearts[t]-1, -1);
  pushHistory(`💔 ${NAMES[t]} perdió una vida (${hearts[t]}/20)`);
  playSound('heartbreak');
  render();
  const ok = await saveProfile(t);
  if(!ok){
    toast('No se ha sincronizado todavía, reintentando en segundo plano…');
    queueRetry('profile:'+t, ()=>saveProfile(t));
  }
}

  pushHistory(`➕ ${NAMES[t]} sumó una vida manualmente (${hearts[t]}/20)`);
  render();
  const ok = await saveProfile(t);
  if(!ok){
    toast('No se ha sincronizado todavía, reintentando en segundo plano…');
    queueRetry('profile:'+t, ()=>saveProfile(t));

function cryptArray(bytes, seed) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const n = bytes.length / 2;
  let s = seed >>> 0;
  for (let i = 0; i < n; i++) {
    s = (Math.imul(0x41c64e6d, s) + 0x6073) >>> 0;
    const xor = (s >>> 16) & 0xffff;
    const word = view.getUint16(i * 2, true);
    view.setUint16(i * 2, word ^ xor, true);
  }
  return bytes;
}

function shuffle67(blockData, sv) {
  if (sv === 0) return blockData;
  const blockSize = 56;
  const blocks = [0, 1, 2, 3].map((i) =>
    blockData.slice(i * blockSize, (i + 1) * blockSize)
  );
  const perm = [0, 1, 2, 3];
  const slotOf = [0, 1, 2, 3];
  const shuffle = BLOCK_POSITION.slice(sv * 4, sv * 4 + 4);
  for (let i = 0; i < 3; i++) {
    const desired = shuffle[i];
    const j = slotOf[desired];
    if (j === i) continue;
    [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    const blockAtI = perm[i];
    perm[j] = blockAtI;
    slotOf[blockAtI] = j;
  }
  const out = new Uint8Array(blockData.length);
  blocks.forEach((b, i) => out.set(b, i * blockSize));
  return out;
}

function decryptPk6(rawSlot) {
  const data = new Uint8Array(rawSlot);
  const view = new DataView(data.buffer);
  const pv = view.getUint32(0, true); // Encryption Constant (EC), NO es el PID real
  const sv = (pv >>> 13) & 31;

  let shuffleRegion = data.slice(8, 8 + 224);
  shuffleRegion = cryptArray(shuffleRegion, pv);
  shuffleRegion = shuffle67(shuffleRegion, sv);
  data.set(shuffleRegion, 8);

  if (data.length > 232) {
    let party = data.slice(232);
    party = cryptArray(party, pv);
    data.set(party, 232);
  }
  return data;
}

function readNickname(dec) {
  // 26 bytes UTF-16LE a partir de offset 0x40 del bloque descifrado (13
  // unidades = 12 caracteres + terminador nulo). OJO: antes se leian solo
  // 24 bytes; con nombres largos (12 caracteres) se podia perder el ultimo.
  const view = new DataView(dec.buffer);
  let out = '';
  for (let i = 0x40; i < 0x40 + 26; i += 2) {
    const code = view.getUint16(i, true);
    if (code === 0) break;
    out += String.fromCharCode(code);
  }
  return out;
}

// solo el PID/EC (offset 0) es un error, porque un Pokemon real inyectado con
// un editor puede tener EC=0 y seguir siendo perfectamente valido (confirmado
// con checksum en saves reales). Tampoco vale mirar si el bloque entero es
// cero: las cajas vacias de verdad SI tienen encryption constant en 0 y el
// resto de bytes con contenido "plantilla" (no ceros), asi que hay que
// descifrar siempre y decidir por la especie resultante.
function readPokemon(rawSlot, hasBattleStats) {

    hp: dec[0x1e], atk: dec[0x1f], def: dec[0x20],
    spe: dec[0x21], spa: dec[0x22], spd: dec[0x23],
  };

  const moves = [
    view.getUint16(0x5a, true),
    view.getUint16(0x5c, true),
    view.getUint16(0x5e, true),
    view.getUint16(0x60, true),
  ];
  const movePP = [dec[0x62], dec[0x63], dec[0x64], dec[0x65]];

  // Mismo orden real que en EVs: HP/Atk/Def/Spe/SpA/SpD dentro del uint32.
  const iv32 = view.getUint32(0x76, true);
  const ivs = {
    hp:  iv32 & 0x1f,
    atk: (iv32 >>> 5) & 0x1f,
    def: (iv32 >>> 10) & 0x1f,
    spe: (iv32 >>> 15) & 0x1f,
    spa: (iv32 >>> 20) & 0x1f,
    spd: (iv32 >>> 25) & 0x1f,
    isEgg: !!((iv32 >>> 30) & 0x1),
    isNicknamed: !!((iv32 >>> 31) & 0x1),
  };
  // Amistad: el offset 0xEE que se probaba antes no era correcto (daba
  // siempre 0). Como Showdown no lo necesita para nada, se deja fuera en
  // vez de enseñar un dato inventado.
  const friendship = null;

  // PS actual/max: solo existen en el bloque de combate que llevan los del
  // equipo (hasBattleStats), las cajas no los tienen -> confirmado contra
  // save real (offset 0xF0 = PS actual, 0xF2 = PS max).
  const hpCurrent = hasBattleStats ? view.getUint16(0xf0, true) : null;
  const hpMax = hasBattleStats ? view.getUint16(0xf2, true) : null;
  return {
    speciesId: species,
    speciesName: SPECIES_NAMES[species] || `#${species}`,
    nickname: readNickname(dec),
    level,
    exp,
    pid: '0x' + pid.toString(16),
    heldItemId,
    abilityId,
    natureId,
    gender,
    formId,
    fatefulEncounter,
    evs,
    ivs,
    moves,
    movePP,
    friendship,
    hpCurrent,
    hpMax,
  };
}

/**
 * @param {ArrayBuffer} buffer - contenido del archivo "main"
 */
function parseUSUMSave(buffer) {
  if (buffer.byteLength !== EXPECTED_SIZE) {
    throw new Error(
      `Tamano de archivo inesperado: ${buffer.byteLength} (se esperaban ${EXPECTED_SIZE} bytes). ` +
      `Asegurate de subir el archivo "main" de Pokemon Ultra Sol/Ultra Luna sin modificar.`
    );
  }
  const data = new Uint8Array(buffer);
  const view = new DataView(buffer);

  // Nombre de entrenador (UTF-16LE terminado en 0x0000)
  const nameBytes = data.slice(TRAINER_CARD_BASE + OT_NAME_OFFSET, TRAINER_CARD_BASE + OT_NAME_OFFSET + 24);
  let name = '';
  for (let i = 0; i < nameBytes.length; i += 2) {
    const code = nameBytes[i] | (nameBytes[i + 1] << 8);
    if (code === 0) break;
    name += String.fromCharCode(code);
  }

  const money = view.getUint32(MONEY_OFFSET, true);

  // Sellos del pasaporte (15 bits, bits 4-18 del uint32 leido en STAMPS_OFFSET)
  const stampsRaw32 = view.getUint32(STAMPS_OFFSET, true);
  const stampsMask = ((stampsRaw32 << 13) >>> 17) & 0x7fff; // 15 bits utiles
  const stamps = [];
  for (let i = 0; i < 15; i++) stamps.push((stampsMask & (1 << i)) !== 0);
  // "badges" equivalente visual: las 4 pruebas de isla + reto insular (bits 1-5)
  const badges = TRIAL_STAMP_BITS.map(bit => stamps[bit]);
  const badgeCount = badges.filter(Boolean).length;

  const party = [];
  for (let slot = 0; slot < PARTY_SLOTS; slot++) {
    const off = PARTY_BASE + slot * PARTY_SLOT_SIZE;
    const raw = data.slice(off, off + PARTY_SLOT_SIZE);
    const p = readPokemon(raw, true);
    if (p) party.push({ slot, ...p });
  }

  const boxes = [];
  for (let box = 0; box < BOXES; box++) {
    const mons = [];
    for (let slot = 0; slot < BOX_SLOTS; slot++) {
      const off = BOX_BASE + box * BOX_STRIDE + slot * BOX_SLOT_SIZE;
      const raw = data.slice(off, off + BOX_SLOT_SIZE);
      const p = readPokemon(raw, false);
      if (p) mons.push({ slot, ...p });
    }
    if (mons.length > 0) boxes.push({ box: box + 1, mons });
  }

  return { trainerName: name, money, stamps, badges, badgeCount, party, boxes };
}

const NATURE_NAMES_ES = ['Fuerte','Huraña','Audaz','Firme','Pícara','Osada','Dócil','Plácida','Agitada','Floja','Miedosa','Activa','Seria','Alegre','Ingenua','Modesta','Afable','Mansa','Tímida','Alocada','Serena','Amable','Grosera','Cauta','Rara'];
// Nombres en ingles, en el MISMO orden que NATURE_NAMES_ES (indice = natureId).
// Hace falta esta version en ingles para el formato de exportacion de
// Pokemon Showdown, que no entiende nombres en español.
const NATURE_NAMES_EN = ['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'];

/* ================================================================
   FORMATO POKEMON SHOWDOWN — resuelve nombres de habilidad/objeto/
   movimiento contra PokeAPI (cacheados) y monta el texto que se
   pega en el "Import" del team builder de Showdown.

   IMPORTANTE: los offsets de EVs/IVs/movimientos/genero son NUEVOS
   (no verificados contra un save real todavia, a diferencia de
   especie/habilidad/naturaleza que si se cotejaron a mano). Antes
   de fiaros del todo, comparad el resultado de un Pokemon conocido
   contra lo que dice PKHeX para ese mismo Pokemon, igual que se hizo
   con nature/ability.
   ================================================================ */
const __pokeApiNameCache = {}; // "ability:123" -> "Sturdy" (o promesa mientras carga)

async function fetchPokeApiName(kind, id) {
  if (!id) return null;
  const key = `${kind}:${id}`;
  if (__pokeApiNameCache[key]) return __pokeApiNameCache[key];
  const promise = fetch(`https://pokeapi.co/api/v2/${kind}/${id}`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data) return null;
      const en = (data.names || []).find(n => n.language?.name === 'en');
      return en ? en.name : (data.name || null);
    })
    .catch(() => null);
  __pokeApiNameCache[key] = promise;
  const name = await promise;
  __pokeApiNameCache[key] = name; // sustituye la promesa por el valor resuelto
  return name;
}

function toShowdownGender(mon) {
  return mon.gender === 'M' ? ' (M)' : mon.gender === 'F' ? ' (F)' : '';
}

async function pokemonToShowdownText(mon, levelOverride) {
  const [abilityName, itemName, ...moveNames] = await Promise.all([
    fetchPokeApiName('ability', mon.abilityId),
    mon.heldItemId ? fetchPokeApiName('item', mon.heldItemId) : Promise.resolve(null),
    ...mon.moves.map(id => id ? fetchPokeApiName('move', id) : Promise.resolve(null)),
  ]);

  const nickname = mon.nickname && mon.nickname !== mon.speciesName ? mon.nickname : null;
  const header = nickname
    ? `${nickname} (${mon.speciesName})${toShowdownGender(mon)}`
    : `${mon.speciesName}${toShowdownGender(mon)}`;
  const itemLine = itemName ? ` @ ${itemName}` : '';

  const lines = [header + itemLine];
  if (abilityName) lines.push(`Ability: ${abilityName}`);
  // Showdown recalcula las estadisticas segun el nivel que le pongamos aqui;
  // no hace falta tocar nada mas (EVs/IVs/nature ya hacen su efecto solos).
  const effectiveLevel = levelOverride ?? mon.level;
  if (effectiveLevel && effectiveLevel !== 100) lines.push(`Level: ${effectiveLevel}`);
  if (mon.friendship != null) lines.push(`Happiness: ${mon.friendship}`);

  const evParts = ['hp', 'atk', 'def', 'spa', 'spd', 'spe']
    .filter(k => mon.evs[k] > 0)
    .map(k => `${mon.evs[k]} ${({hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'})[k]}`);
  if (evParts.length) lines.push(`EVs: ${evParts.join(' / ')}`);

  const natureName = NATURE_NAMES_EN[mon.natureId] ?? 'Hardy';
  lines.push(`${natureName} Nature`);

  const ivParts = ['hp', 'atk', 'def', 'spa', 'spd', 'spe']
    .filter(k => mon.ivs[k] < 31)
    .map(k => `${mon.ivs[k]} ${({hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'})[k]}`);
  if (ivParts.length) lines.push(`IVs: ${ivParts.join(' / ')}`);

  moveNames.filter(Boolean).forEach(m => lines.push(`- ${m}`));

  return lines.join('\n');
}

async function copyTeamAsShowdown(team, levelOverride) {
  toast('Consultando nombres (PokeAPI)…');
  try {
    const texts = await Promise.all(team.map(mon => pokemonToShowdownText(mon, levelOverride)));
    const full = texts.join('\n\n');
    await navigator.clipboard.writeText(full);
    toast(levelOverride
      ? `Equipo copiado a Nv.${levelOverride} (Showdown) ✅`
      : 'Equipo copiado en formato Showdown ✅');
  } catch (e) {
    toast('No se ha podido copiar: ' + (e.message || e));
  }
}

async function handleSaveFile(t, file){
  const err = document.getElementById('save-import-err');
  const preview = document.getElementById('save-import-preview');
  if(!file) return;
  err.textContent = '';
  preview.innerHTML = '<p style="font-size:12px;color:var(--silver-dim);">Leyendo…</p>';
  playSound('click');
  try{
    const buf = await file.arrayBuffer();
    const result = parseUSUMSave(buf);
    window.__lastSaveImport = { trainer: t, result };
    const mismatch = result.trainerName && result.trainerName.toUpperCase() !== NAMES[t].toUpperCase();
    preview.innerHTML = `
      ${mismatch ? `<div class="err-msg" style="margin-bottom:10px;">⚠️ El save dice ser de "${result.trainerName}", pero estás importando para ${NAMES[t]}. Comprueba que sea el archivo correcto antes de continuar.</div>` : ''}

      <div style="display:flex;gap:6px;margin-bottom:14px;">
        ${result.badges.map((got,i)=>`<div style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid ${got?'var(--gold)':'var(--border)'};background:${got?'radial-gradient(circle,var(--gold),#8a6a2e)':'var(--panel-2)'};color:${got?'#1c140a':'var(--silver-dim)'};" title="Sello ${i+1}">${i+1}</div>`).join('')}
      </div>
      <div class="section-label" style="margin:0 0 8px;text-align:left;">Equipo detectado (${result.party.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;margin-bottom:16px;">
        ${result.party.map(p=>`
          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;text-align:left;">
            <strong style="color:var(--silver-bright);">${p.nickname || p.speciesName}</strong> <span style="color:var(--silver-dim);">(${p.speciesName})</span> · Nv.${p.level ?? '?'}<br>
            <span style="color:var(--silver-dim);">Naturaleza: ${NATURE_NAMES_ES[p.natureId] ?? p.natureId} · Habilidad #${p.abilityId}</span>
          </div>
        `).join('')}
      </div>
      <div class="modal-actions">
        <button class="ghost" onclick="closeModal()">Cancelar</button>
        <button class="ghost" onclick="copyTeamAsShowdown(window.__lastSaveImport.result.party)">📋 Copiar equipo (Showdown)</button>
        <button class="ghost" onclick="copyTeamAsShowdown(window.__lastSaveImport.result.party, 50)">📋 Copiar equipo (Nv.50)</button>
        <button class="primary" id="save-import-confirm" onclick="confirmImportTeam('${t}')">Sustituir equipo por este (${result.party.length})</button>
      </div>
    `;
  }catch(e){
    err.textContent = e.message || 'No se ha podido leer ese archivo. Asegúrate de subir el "main" sin modificar.';
    preview.innerHTML = '';
  }
}

async function confirmImportTeam(t){
  const data = window.__lastSaveImport;
  if(!data || data.trainer !== t) return;
  const btn = document.getElementById('save-import-confirm');
  if(btn){ btn.disabled = true; btn.textContent = 'Importando…'; }
  const newTeam = [];
  for(const p of data.result.party.slice(0,6)){
    try{
      const sp = await fetchPokemonSprite(p.speciesName);
      newTeam.push({
        id: crypto.randomUUID(),
        nickname: p.nickname || sp.name,
        species: sp.name,
        sprite: sp.sprite,
        level: p.level ?? null,
        pid: p.pid || null,
        fainted: p.hpCurrent === 0,
      });
    }catch(e){
      // si falla la busqueda de sprite de uno en concreto, seguimos con el resto
    }
  }
  teams[t] = newTeam;
  pushHistory(`📥 ${NAMES[t]} importó su equipo desde el save (${newTeam.length} Pokémon)`);
  closeModal();
  render();
  playSound('win');
  fireConfetti({ count: 80 });
  const ok = await saveProfile(t);
  if(!ok) queueRetry('profile:'+t, ()=>saveProfile(t));
}

/* ---------------- PokeAPI helpers ---------------- */
async function fetchPokemonSprite(name){
  const slug = name.toLowerCase().trim().replace(/\s+/g,'-');
  const res = await fetch('https://pokeapi.co/api/v2/pokemon/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const sprite = (data.sprites.other && data.sprites.other['official-artwork'] && data.sprites.other['official-artwork'].front_default) || data.sprites.front_default;
  if(!sprite) throw new Error('no sprite');
  return { name: data.name, sprite };
}
async function fetchItemSprite(name){
  const slug = name.toLowerCase().trim().replace(/\s+/g,'-');
  const res = await fetch('https://pokeapi.co/api/v2/item/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const sprite = data.sprites && data.sprites.default;
  if(!sprite) throw new Error('no sprite');
  return { name: data.name, sprite };
}

/* ---------------- Autocomplete ---------------- */
function attachAutocomplete(inputEl, dropdownEl, getList){
  inputEl.addEventListener('input', ()=>{
    const val = inputEl.value.trim().toLowerCase();
    if(val.length < 3){ dropdownEl.classList.remove('show'); dropdownEl.innerHTML=''; return; }
    const list = getList();
    const matches = list.filter(n=> n.startsWith(val)).slice(0, 8);
    if(matches.length === 0){ dropdownEl.classList.remove('show'); dropdownEl.innerHTML=''; return; }
    dropdownEl.innerHTML = matches.map(n=>`<div class="autocomplete-item">${n.replace(/-/g,' ')}</div>`).join('');
    dropdownEl.classList.add('show');
    [...dropdownEl.children].forEach((el,i)=>{
      el.onclick = ()=>{
        inputEl.value = matches[i];
        dropdownEl.classList.remove('show'); dropdownEl.innerHTML='';
        inputEl.focus();
      };
    });
  });
  inputEl.addEventListener('blur', ()=> setTimeout(()=>{ dropdownEl.classList.remove('show'); }, 150));
}

        ${payers.map(t=>`<option value="${t}">${NAMES[t]} (${tickets[t]||0} 🎟️)</option>`).join('')}
      </select>
    </div>
    <div class="err-msg" id="reveal-err"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="confirmRevealAbility('${targetTrainer}')">Pagar y revelar</button>
    </div>
  `);
}
async function confirmRevealAbility(targetTrainer){
  const payer = document.getElementById('reveal-payer-select').value;
  const err = document.getElementById('reveal-err');
  if((tickets[payer]||0) < ABILITY_REVEAL_COST){
    err.textContent = `${NAMES[payer]} no tiene suficientes tickets.`;
    return;
  }
  const pool = allMonsOf(targetTrainer).filter(m=>m.inTeam);
  const mon = pool[Math.floor(Math.random()*pool.length)];
  await addTickets(payer, -ABILITY_REVEAL_COST, `Revelar habilidad (Pokémon de ${NAMES[targetTrainer]})`);
  pushHistory(`🔍 ${NAMES[payer]} pagó ${ABILITY_REVEAL_COST} tickets y descubrió que el ${mon.nickname} de ${NAMES[targetTrainer]} tiene ${mon.abilityName || 'una habilidad desconocida'}`);
  openModal(`
    <h3>🔓 ¡Habilidad revelada!</h3>
    <div style="text-align:center;margin:12px 0;">
      <img loading="lazy" src="${mon.sprite}" style="width:96px;height:96px;">
      <div style="font-weight:700;font-size:16px;color:var(--silver-bright);">${mon.nickname}</div>
      <div style="font-size:12px;color:var(--silver-dim);text-transform:capitalize;">${mon.speciesName.replace(/-/g,' ')} · de ${NAMES[targetTrainer]}</div>
      <div class="location-pill" style="font-size:13px;padding:6px 16px;margin-top:10px;">✨ ${mon.abilityName || 'Desconocida'}</div>
    </div>
    <div class="modal-actions">
      <button class="primary" onclick="closeModal()">Vale</button>
    </div>
  `);
  render();
}

let wantedPokemonTarget = null; // {trainer, pid, nickname, speciesName, sprite} -- lo que se pide a cambio
let offerSelectedPids = new Set(); // pids elegidos de la lista de "con qué ofertas"

function openOfferForPokemon(ownerTrainer, pid){
  const mon = allMonsOf(ownerTrainer).find(m=>m.pid===pid);
  if(!mon) return;
  wantedPokemonTarget = { trainer: ownerTrainer, pid, nickname: mon.nickname, speciesName: mon.speciesName, sprite: mon.sprite, metLocationName: mon.metLocationName };
  offerSelectedPids = new Set();
  const otherTrainers = TRAINERS.filter(t=>t!==ownerTrainer);
  openModal(`
    <h3>Ofertar por ${mon.nickname}</h3>
    <div class="field">
      <label>¿Quién hace la oferta?</label>
      <select id="offerer-select" onchange="renderOffererPokemonList()">
        ${otherTrainers.map(t=>`<option value="${t}">${NAMES[t]}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>¿Con qué Pokémon suyo/s? (puede elegir varios)</label>
      <div id="offerer-pokemon-list" class="normas-list" style="max-height:260px;overflow-y:auto;"></div>
    </div>
    <div class="err-msg" id="poke-offer-err"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="submitPokemonOffer()">Publicar oferta</button>
    </div>
  `);
  renderOffererPokemonList();
}
function renderOffererPokemonList(){
  const t = document.getElementById('offerer-select').value;
  offerSelectedPids = new Set();
  const list = availableMonsOf(t);
  const el = document.getElementById('offerer-pokemon-list');
  if(list.length === 0){ el.innerHTML = '<div class="empty-state">No tiene ningún Pokémon disponible.</div>'; return; }
  el.innerHTML = list.map(m=>`
    <label class="pick-mon-item" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
      <input type="checkbox" value="${m.pid}" onchange="toggleOfferSelected('${m.pid}', this.checked)">
      <img loading="lazy" src="${m.sprite}" style="width:36px;height:36px;">
      <div>
        <div class="n-text">${m.nickname}${m.level!=null ? ` · Nv.${m.level}` : ''}</div>
        <div class="n-meta mono">${m.speciesName.replace(/-/g,' ')}${m.inTeam ? ' · equipo' : ' · caja'}</div>
      </div>
    </label>
  `).join('');
}
function toggleOfferSelected(pid, checked){
  if(checked) offerSelectedPids.add(pid); else offerSelectedPids.delete(pid);
}
async function submitPokemonOffer(){
  const trainer = document.getElementById('offerer-select').value;
  const err = document.getElementById('poke-offer-err');
  if(offerSelectedPids.size === 0){ err.textContent = 'Elige al menos un Pokémon con el que ofertar.'; return; }
  const items = availableMonsOf(trainer)
    .filter(m=>offerSelectedPids.has(m.pid))
    .map(m=>({ type:'pokemon', name: m.speciesName, sprite: m.sprite, pid: m.pid, nickname: m.nickname }));
  tradesActive.unshift({
    id: crypto.randomUUID(), trainer, items, ts: Date.now(), counters: [],
    wantedPokemon: wantedPokemonTarget,
  });
  pushHistory(`🔁 ${NAMES[trainer]} ofertó por ${wantedPokemonTarget.nickname} de ${NAMES[wantedPokemonTarget.trainer]}`);
  closeModal();
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

let pendingItems = [];
function openNewGenericOffer(mode, offerId){
  pendingItems = [];
  openModal(`
    <h3>${mode==='offer' ? 'Nueva oferta' : 'Ofrecer a cambio'}</h3>
    <div class="field">
      <label>¿Quién ${mode==='offer'?'ofrece':'ofrece a cambio'}?</label>
      <select id="tr-select">
        ${TRAINERS.map(t=>`<option value="${t}">${NAMES[t]}</option>`).join('')}
      </select>
    </div>
    <div class="item-row-add">
      <div class="field">
        <label>Tipo</label>
        <select id="it-type">
          <option value="pokemon">Pokémon</option>
          <option value="item">Objeto</option>
        </select>
      </div>
      <div class="field autocomplete-wrap">
        <label>Nombre</label>
        <input type="text" id="it-name" placeholder="ej: tyranitar" autocomplete="off">
        <div class="autocomplete-list" id="it-name-list"></div>
      </div>
      <button class="ghost" onclick="addPendingItem()">Añadir</button>
    </div>
    <div class="err-msg" id="offer-err"></div>
    <div class="pending-chips" id="pending-chips"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="submitOffer('${mode}', ${offerId?`'${offerId}'`:'null'})">Publicar</button>
    </div>
  `);
  attachAutocomplete(
    document.getElementById('it-name'),
    document.getElementById('it-name-list'),
    ()=> document.getElementById('it-type').value === 'pokemon' ? POKEMON_NAMES : ITEM_NAMES
  );
}
async function addPendingItem(){
  const type = document.getElementById('it-type').value;
  const name = document.getElementById('it-name').value.trim();
  const err = document.getElementById('offer-err');
  err.textContent = '';
  if(!name) return;
  err.textContent = 'Buscando…';
  try{
    const res = type==='pokemon' ? await fetchPokemonSprite(name) : await fetchItemSprite(name);
    pendingItems.push({ type, name: res.name, sprite: res.sprite });
    document.getElementById('it-name').value = '';
    err.textContent = '';
    renderPendingChips();
  }catch(e){
    err.textContent = 'No se encontró eso. Prueba el nombre en inglés.';
  }
}
function renderPendingChips(){
  document.getElementById('pending-chips').innerHTML = pendingItems.map((it,i)=>
    `<div class="chip"><img loading="lazy" src="${it.sprite}"><span>${it.name.replace(/-/g,' ')}</span> <button class="ghost" style="padding:0 6px;" onclick="removePendingItem(${i})">✕</button></div>`
  ).join('');
}
function removePendingItem(i){ pendingItems.splice(i,1); renderPendingChips(); }

async function submitOffer(mode, offerId){
  const trainer = document.getElementById('tr-select').value;
  const err = document.getElementById('offer-err');
  if(pendingItems.length === 0){ err.textContent = 'Añade al menos una cosa a la oferta.'; return; }

  if(mode === 'offer'){
    tradesActive.unshift({ id: crypto.randomUUID(), trainer, items: pendingItems, ts: Date.now(), counters: [] });
    pushHistory(`🔁 ${NAMES[trainer]} publicó una oferta de trade`);
  } else {
    const offer = tradesActive.find(o=>o.id===offerId);
    if(offer){
      offer.counters.push({ id: crypto.randomUUID(), trainer, items: pendingItems, ts: Date.now() });
      pushHistory(`🔁 ${NAMES[trainer]} ofreció algo a cambio en un trade`);
    }
  }
  closeModal();
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function acceptTrade(offerId, counterId){
  const offer = tradesActive.find(o=>o.id===offerId);
  if(!offer) return;
  const counter = offer.counters.find(c=>c.id===counterId);
  if(!counter) return;
  if(!confirm(`¿Aceptar que ${NAMES[offer.trainer]} dé sus cosas a cambio de lo de ${NAMES[counter.trainer]}?`)) return;

  tradesHistory.unshift({
    id: crypto.randomUUID(),
    offerTrainer: offer.trainer, offerItems: offer.items,
    counterTrainer: counter.trainer, counterItems: counter.items,
    ts: Date.now()
  });
  tradesActive = tradesActive.filter(o=>o.id!==offerId);
  pushHistory(`🤝 Trade cerrado entre ${NAMES[offer.trainer]} y ${NAMES[counter.trainer]}`);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function cancelOffer(offerId){
  if(!confirm('¿Cancelar esta oferta?')) return;
  tradesActive = tradesActive.filter(o=>o.id!==offerId);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function deleteTradeRecord(id){
  if(!confirm('¿Eliminar este trade del historial? (Úsalo cuando ya esté pagado)')) return;
  tradesHistory = tradesHistory.filter(r=>r.id!==id);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

/* ---------------- INIT + polling ---------------- */
(async function init(){
  const slider = document.getElementById('volume-slider');
  if(slider) slider.value = Math.round(soundVolume*100);
  const muteBtn = document.getElementById('mute-btn');
  if(muteBtn) muteBtn.textContent = soundMuted ? '🔇' : '🔊';
  loadNameLists();
  await loadAll();
  await seedDefaultNormasIfMissing();
  render();
  showNewsPopupIfAny();
  setInterval(async ()=>{
    if(document.getElementById('modal-overlay') || duelSpinning || rouletteSpinning || slotSpinning || slotJackpotSpinning || loteriaDrawing || bjDealing || nineDealing || finalWheelSpinningWinner || finalWheelSpinningLoser || match1LoserWheelSpinning || sancionWheelSpinning || eggWheelSpinning || (view==='final' && finalState && finalState.unlocked)) return; // don't refresh mid-edit, mid-spin, o mientras se está revelando LA FINAL
    const changed = await loadAll();
    if(changed) render(); // si no ha cambiado nada, nos ahorramos reconstruir toda la pantalla
  }, 6000);
})();
</script>
